<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="file:///mnt/data/howto_pkg_work/css/styles.css">
<style>body{padding:24px;background:#121213} .frame{width:900px;margin:0 auto;}</style></head>
<body><div class="frame">
<section class="card auth-card">
  <div class="section-head">
    <h3>Account</h3>
    <button class="ghost-btn hidden">Sign out</button>
  </div>
  <div class="status-text">Create an account or sign in.</div>
  <form class="stack-form">
    <label>Display name
      <input type="text" value="AJ" />
    </label>
    <label>Email
      <input type="email" value="friend@example.com" />
    </label>
    <label>Password
      <input type="password" value="password123" />
    </label>
    <div class="button-row wrap">
      <button type="button">Sign up</button>
      <button type="button" class="secondary-btn">Sign in</button>
      <button type="button" class="ghost-btn">Magic link</button>
    </div>
  </form>
</section>
</div></body></html>
