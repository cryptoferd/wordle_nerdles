<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⬛🟨🟩Wordle Nerdles🟩🟨⬛ - Leaderboard</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Wordle Nerdles 🤓 🟩🟨⬛</h1>
      <p class="tagline">All-time rankings and recent heaters.</p>
    </div>
    <nav class="nav">
      <a href="index.html">Today</a>
      <a href="leaderboard.html" aria-current="page">Leaderboard</a>
      <a href="daily.html">Archive</a>
      <a href="answers.html">Past Answers</a>
      <a href="profile.html">Profile</a>
    </nav>
    <section class="ticker-shell header-ticker" aria-label="Weekly standings banner">
      <div class="ticker-track-wrap">
        <div id="weekly-ticker-track" class="ticker-track">
          <span class="ticker-item">Loading weekly standings…</span>
        </div>
      </div>
    </section>
  </header>

  <main class="page-grid single-column">
    <section class="card">
      <div class="section-head wrap">
        <h2>Leaderboard</h2>
        <div class="button-row compact filter-scroll">
          <button class="filter-btn" data-range="daily">Daily winner</button>
          <button class="filter-btn active" data-range="week">Weekly</button>
          <button class="filter-btn" data-range="month">Monthly</button>
          <button class="filter-btn" data-range="all">All time</button>
        </div>
      </div>
      <div id="period-nav" class="period-nav">
        <div class="button-row compact">
          <button id="period-prev-btn" type="button" class="ghost-btn">← Previous</button>
          <button id="period-current-btn" type="button" class="ghost-btn">Current</button>
          <button id="period-next-btn" type="button" class="ghost-btn">Next →</button>
        </div>
        <div id="period-nav-label" class="muted">Viewing current week</div>
      </div>
      <div id="leaderboard-summary" class="summary-grid leaderboard-summary"></div>
      <div id="leaderboard-table-wrap" class="empty-state">Loading leaderboard…</div>
    </section>
  </main>

  <script type="module" src="js/leaderboard.js"></script>
  <script type="module" src="./js/ticker.js"></script>
</body>
</html>
